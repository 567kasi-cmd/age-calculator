<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Video Tools — The Age Finder (debug)</title>
  <meta name="description" content="YouTube + Instagram Reels downloader UI (frontend) - debug mode." />
  <style>
    :root{--bg1:#667eea;--bg2:#764ba2;--card-bg: rgba(255,255,255,0.08);--accent:#ffd700;--muted:rgba(255,255,255,0.85);--input-bg:rgba(0,0,0,0.18)}
    html,body{height:100%;margin:0}
    body{font-family:Poppins,Inter,system-ui,Arial;background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;justify-content:center;padding:36px 18px;color:#fff}
    .container{width:100%;max-width:1000px;background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));border-radius:18px;padding:20px;border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(6px)}
    h1{font-size:28px;color:var(--accent);margin:0 0 6px 0}
    p.lead{margin:0 0 14px 0;color: rgba(255,255,255,0.8)}
    label{display:block;font-size:13px;color:#ffeeb3;margin-bottom:6px;font-weight:600}
    #videoUrl{width:100%;height:44px;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);background:var(--input-bg);color:#fff;font-size:15px;outline:none}
    select{width:100%;padding:12px;border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.12));color:#fff;border:1px solid rgba(255,255,255,0.08);font-size:15px}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .actions{display:flex;gap:10px;margin-top:12px;align-items:center}
    button.cta{background:#fff;color:var(--bg2);padding:10px 14px;border-radius:10px;border:none;cursor:pointer;font-weight:700}
    button.ghost{background:transparent;color:#fff;padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.1)}
    .meta{display:flex;gap:12px;align-items:center;margin-top:12px;padding:12px;border-radius:10px;background:rgba(0,0,0,0.08)}
    .thumb{width:140px;height:80px;object-fit:cover;border-radius:6px}
    pre{margin-top:12px;background:rgba(0,0,0,0.18);padding:12px;border-radius:8px;overflow:auto;color:#fff}
    .link-pills{margin-top:12px;display:flex;gap:10px}
    .link-pills a{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,0.03);color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,0.04);font-weight:600}
    footer{margin-top:14px;color:rgba(255,255,255,0.8);font-size:13px;text-align:center}
    @media (max-width:820px){.controls{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 Video Tools — Downloader (debug)</h1>
    <p class="lead">Debug mode — shows raw server response to help fix JSON errors.</p>

    <div>
      <label for="service">Service</label>
      <select id="service"><option value="youtube">YouTube</option><option value="instagram">Instagram Reels</option></select>
    </div>

    <div style="margin-top:10px">
      <label for="videoUrl">Video URL</label>
      <input id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." />
    </div>

    <div class="controls" style="margin-top:10px">
      <div>
        <label for="quality">Quality</label>
        <select id="quality">
          <option value="2160p">2160p (4K)</option>
          <option value="1440p">1440p</option>
          <option value="1080p">1080p</option>
          <option value="720p">720p</option>
          <option value="480p">480p</option>
          <option value="360p">360p</option>
          <option value="240p">240p</option>
          <option value="highestaudio">Audio only (best)</option>
        </select>
      </div>

      <div>
        <label for="format">Format</label>
        <select id="format"><option value="mp4">MP4 (video + audio)</option><option value="video-only">MP4 (video only)</option><option value="mp3">MP3 (audio only)</option></select>
      </div>
    </div>

    <div class="actions">
      <button id="infoBtn" class="cta">Fetch Info</button>
      <button id="downloadBtn" class="cta">Download</button>
      <button id="resetBtn" class="ghost">Reset</button>
      <div id="status" style="margin-left:auto;color:rgba(255,255,255,0.85)">Status: idle</div>
    </div>

    <div id="metaBox" class="meta" style="display:none">
      <img id="thumb" class="thumb" src="" alt="thumbnail" />
      <div class="info">
        <h3 id="title">—</h3>
        <p id="duration">Duration: —</p>
        <p id="author">Author: —</p>
      </div>
    </div>

    <pre id="infoBox" style="display:none"></pre>

    <div class="link-pills">
      <a href="/bmi-calculator/">⚖️ BMI Calculator</a>
      <a href="/date-difference/">📅 Date Difference</a>
      <a href="/">🏠 Back to Home</a>
    </div>

    <footer>© 2025 Age Calculator — Debug Mode (remove when fixed)</footer>
  </div>

  <script>
    // configuration - change if needed
    const WORKER_BASE = 'https://floral-sunset-9ef5.567kasi.workers.dev' // your worker URL
    const TEST_API_KEY = 'test-token'

    // element refs
    const serviceEl = document.getElementById('service')
    const urlEl = document.getElementById('videoUrl')
    const qualityEl = document.getElementById('quality')
    const formatEl = document.getElementById('format')
    const infoBox = document.getElementById('infoBox')
    const metaBox = document.getElementById('metaBox')
    const thumb = document.getElementById('thumb')
    const titleEl = document.getElementById('title')
    const durationEl = document.getElementById('duration')
    const authorEl = document.getElementById('author')
    const status = document.getElementById('status')

    // reset button
    document.getElementById('resetBtn').addEventListener('click', ()=> {
      urlEl.value = ''; infoBox.style.display='none'; metaBox.style.display='none'; status.innerText = 'Status: idle'
    })

    // Info button (debug-safe, shows raw server response)
    document.getElementById('infoBtn').addEventListener('click', async ()=>{
      const url = urlEl.value.trim()
      if(!url) return alert('Enter a URL')
      status.innerText = 'Status: fetching info...'; infoBox.style.display='none'; metaBox.style.display='none'
      try {
        const svc = serviceEl.value
        const endpoint = (typeof WORKER_BASE === 'string' && WORKER_BASE) ? WORKER_BASE + '/api/' + svc + '/info' : '/api/' + svc + '/info'
        const res = await fetch(endpoint + '?url=' + encodeURIComponent(url), { headers: {'x-api-key': TEST_API_KEY} })
        const text = await res.text()
        const ct = (res.headers.get('content-type') || '').toLowerCase()
        infoBox.style.display = 'block'
        infoBox.textContent = `HTTP ${res.status}\nContent-Type: ${ct}\n\n` + text
        status.innerText = res.ok ? 'Status: info loaded (raw shown)' : 'Error: HTTP ' + res.status
        if (ct.includes('application/json')) {
          try {
            const j = JSON.parse(text)
            if(j.title) titleEl.innerText = j.title
            if(j.lengthSeconds) durationEl.innerText = 'Duration: ' + formatDuration(j.lengthSeconds)
            if(j.thumbnails && j.thumbnails.length) thumb.src = j.thumbnails[j.thumbnails.length-1].url || ''
            if(j.author) authorEl.innerText = 'Author: ' + j.author
            metaBox.style.display = 'flex'
          } catch(e){}
        }
      } catch(e){
        status.innerText = 'Error: ' + e.message
        infoBox.style.display = 'block'
        infoBox.textContent = 'Fetch exception: ' + (e && e.stack ? e.stack : e.message || String(e))
      }
    })

    // Robust Download handler
    document.getElementById('downloadBtn').addEventListener('click', async () => {
      const url = urlEl.value.trim();
      if (!url) return alert('Enter a URL');

      const svc = serviceEl.value;
      const quality = (typeof qualityEl !== 'undefined' && qualityEl) ? qualityEl.value : undefined;
      const format = (typeof formatEl !== 'undefined' && formatEl) ? formatEl.value : undefined;

      status.innerText = 'Status: requesting download...';
      infoBox.style.display = 'none';

      try {
        const endpoint = (typeof WORKER_BASE === 'string' && WORKER_BASE) ?
          WORKER_BASE + '/api/' + svc + '/download' : '/api/' + svc + '/download';

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-api-key': TEST_API_KEY || '' },
          body: JSON.stringify({ url, quality, format })
        });

        // read headers & content-type
        const contentType = (response.headers.get('content-type') || '').toLowerCase();

        // If not OK, show raw text for debugging
        if (!response.ok) {
          const txt = await response.text().catch(() => '[no body]');
          infoBox.style.display = 'block';
          infoBox.textContent = `HTTP ${response.status}\nContent-Type: ${contentType}\n\n${txt}`;
          status.innerText = 'Error: HTTP ' + response.status;
          return;
        }

        // JSON response (typical debug/proxy returning { downloadUrl })
        if (contentType.includes('application/json')) {
          const txt = await response.text().catch(() => '')
          let obj;
          try { obj = JSON.parse(txt || '{}') }
          catch (e) {
            infoBox.style.display = 'block';
            infoBox.textContent = 'Invalid JSON response:\n\n' + txt;
            status.innerText = 'Error: invalid json';
            return;
          }
          // if backend returned downloadUrl, open it
          if (obj && obj.downloadUrl) {
            window.open(obj.downloadUrl, '_blank');
            status.innerText = 'Status: download launched';
            return;
          }
          // otherwise show returned JSON
          infoBox.style.display = 'block';
          infoBox.textContent = JSON.stringify(obj, null, 2);
          status.innerText = 'Status: json response shown';
          return;
        }

        // Plain text/html response -> show raw (likely an error or informational page)
        if (contentType.startsWith('text/')) {
          const txt = await response.text().catch(() => '[no body]');
          infoBox.style.display = 'block';
          infoBox.textContent = `HTTP ${response.status}\nContent-Type: ${contentType}\n\n` + txt;
          status.innerText = 'Status: raw response shown';
          return;
        }

        // Otherwise, treat response as binary (video/audio stream) and download it
        const ab = await response.arrayBuffer();
        const blob = new Blob([ab], { type: contentType || 'application/octet-stream' });
        const blobUrl = URL.createObjectURL(blob);

        // Create a filename from video title if available, otherwise use default
        let filename = 'download';
        try {
          const disp = response.headers.get('content-disposition') || '';
          const m = disp.match(/filename="?(.*?)"?($|;)/);
          if (m && m[1]) filename = m[1];
          else {
            if (format === 'mp3') filename = 'audio.mp3';
            else filename = 'video.mp4';
          }
        } catch (e) { filename = format === 'mp3' ? 'audio.mp3' : 'video.mp4' }

        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(blobUrl);

        status.innerText = 'Status: download started';
      } catch (err) {
        status.innerText = 'Fetch exception: ' + (err && err.message ? err.message : String(err));
        infoBox.style.display = 'block';
        infoBox.textContent = 'Exception: ' + (err && err.stack ? err.stack : String(err));
      }
    });

    function formatDuration(sec){
      sec = Number(sec)
      if(isNaN(sec)) return sec
      const h = Math.floor(sec/3600); const m = Math.floor((sec%3600)/60); const s = sec%60
      return (h? h+'h ':'') + (m? m+'m ':'') + s + 's'
    }
  </script>
</body>
</html>
