<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 🔹 SEO and Branding -->
  <title>⚖️ BMI Calculator | Calculate Body Mass Index | The Age Finder</title>
  <meta name="description" content="Instantly calculate your Body Mass Index (BMI) with The Age Finder. Find out if you're underweight, healthy, overweight, or obese using our free online tool." />
  <meta name="keywords" content="BMI calculator, body mass index, health calculator, weight check, fitness, The Age Finder" />
  <meta name="author" content="The Age Finder Team" />
  <meta name="robots" content="index, follow" />

  <!-- 🔹 Open Graph (for SEO previews on Google, WhatsApp, Facebook) -->
  <meta property="og:title" content="BMI Calculator | The Age Finder" />
  <meta property="og:description" content="Check your BMI instantly with The Age Finder's free online calculator. Simple, accurate, and quick." />
  <meta property="og:url" content="https://theagefinder.pages.dev/bmi-calculator/" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/agecalc-preview.png" />
  <link rel="canonical" href="https://theagefinder.pages.dev/bmi-calculator/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="BMI Calculator | The Age Finder" />
  <meta name="twitter:description" content="Free online BMI calculator to check your body mass index instantly." />

  <!-- 🔹 Shared styles + analytics (deferred) -->
  <link rel="stylesheet" href="/styles/shared.css" />
  <script defer src="/scripts/analytics.js"></script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "BMI Calculator",
    "url": "https://theagefinder.pages.dev/bmi-calculator/",
    "applicationCategory": "HealthApplication",
    "operatingSystem": "Any",
    "description": "Free BMI calculator to estimate body mass index and weight category.",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "INR"
    }
  }
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What is BMI?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "BMI (Body Mass Index) is a measure of body fat based on height and weight. It applies to adult men and women."
        }
      },
      {
        "@type": "Question",
        "name": "What is a healthy BMI?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "A BMI between 18.5 and 24.9 is considered normal weight. Below 18.5 is underweight, 25-29.9 is overweight, and above 30 is obese."
        }
      },
      {
        "@type": "Question",
        "name": "How accurate is the BMI calculator?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "The BMI calculator is a screening tool. For a complete health assessment, consult with a healthcare professional."
        }
      },
      {
        "@type": "Question",
        "name": "Can I use this BMI calculator for children?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "BMI for children is calculated differently and varies by age and gender. Consult a pediatrician for children's BMI."
        }
      }
    ]
  }
  </script>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.8s ease-in-out;
    }

    header {
      text-align: center;
      padding: 50px 20px 20px;
    }

    header h1 {
      font-size: 2.2rem;
      color: #ffd700;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
      margin: 0 0 10px 0;
    }

    header p {
      font-size: 1rem;
      opacity: 0.9;
      color: #fff;
      margin: 0;
    }

    .nav {
      text-align: center;
      margin-top: 10px;
    }

    .nav a {
      color: #ffd700;
      text-decoration: none;
      margin: 0 10px;
      transition: 0.3s;
      opacity: 0.95;
    }

    .nav a:hover {
      color: #fff;
      text-decoration: underline;
    }

    main {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 30px;
    }

    .calculator {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 25px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: 500;
      text-align: left;
    }

    input {
      width: 90%;
      padding: 8px;
      border-radius: 10px;
      border: none;
      outline: none;
      margin-bottom: 10px;
      font-size: 16px;
    }

    button {
      background: #ffd700;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
      width: 90%;
    }

    button:hover {
      background: #fff;
      color: #333;
    }

    .result {
      margin-top: 20px;
      font-size: 1.1rem;
      font-weight: 500;
    }

    footer {
      text-align: center;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      margin-top: auto;
      padding: 20px;
    }

    footer a {
      color: #ffd700;
      text-decoration: none;
      transition: 0.3s;
    }

    footer a:hover {
      text-decoration: underline;
      color: #fff;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      header h1 {
        font-size: 1.8rem;
      }

      main {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>⚖️ BMI Calculator</h1>
    <p>Check your Body Mass Index instantly and track your fitness level.</p>
    <div class="nav">
      <a href="/" title="Home">🏠 Home</a>
      <a href="/" title="Age Calculator">🎂 Age Calculator</a>
      <a href="/bmi-calculator/" title="BMI">⚖️ BMI</a>
      <a href="/date-difference/" title="Date Difference">📅 Date Diff</a>
      <a href="/emi-calculator/" title="EMI">💵 EMI</a>
    </div>
  </header>

  <main>
    <div class="calculator">
      <form id="bmiForm">
        <label for="weight">Weight (kg)</label>
        <input type="number" id="weight" placeholder="Enter weight in kilograms" required aria-label="Weight in kilograms">

        <label for="height">Height (cm)</label>
        <input type="number" id="height" placeholder="Enter height in centimeters" required aria-label="Height in centimeters">

        <button type="submit">Calculate BMI</button>

        <div class="result" id="result" aria-live="polite" aria-atomic="true"></div>
      </form>
    </div>
  </main>

  <footer>
    <a href="/">← Back to The Age Finder</a>
  </footer>

  <script type="module" defer src="/scripts/pages/bmi-page.js"></script>
</body>
</html>
