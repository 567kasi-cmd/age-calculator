<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BMI Calculator — The Age Finder Tools</title>
  <meta name="description" content="BMI Calculator — compute your Body Mass Index quickly. Supports kg/cm and lb/in. Includes BMI category and tips." />
  <meta property="og:title" content="BMI Calculator — The Age Finder Tools" />
  <meta property="og:description" content="Compute your BMI in seconds. Get BMI value and category (Underweight, Normal, Overweight, Obese)." />
  <meta property="og:url" content="https://theagefinder.pages.dev/bmi-calculator/" />
  <link rel="canonical" href="https://theagefinder.pages.dev/bmi-calculator/" />
  <style>
    body{font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center}
    .card{background:rgba(255,255,255,0.08);padding:24px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.25);width:340px;text-align:left}
    h1{margin:0 0 8px;font-size:20px}
    label{display:block;margin-top:10px;font-size:13px;color:#eaeefe}
    input, select{width:100%;padding:8px;border-radius:8px;border:none;margin-top:6px;font-size:15px}
    .row{display:flex;gap:8px}
    .btns{margin-top:14px;display:flex;gap:8px;justify-content:flex-end}
    button{padding:10px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:600}
    button.calc{background:#fff;color:#764ba2}
    button.reset{background:#ff5c5c;color:#fff}
    .result{margin-top:14px;background:rgba(255,255,255,0.06);padding:10px;border-radius:8px;font-size:15px;line-height:1.4}
    .nav{font-size:13px;margin-bottom:8px}
    .nav a{color:#fff;text-decoration:none;margin-right:10px;opacity:0.95}
  </style>
</head>
<body>
  <div class="card" role="main">
    <div class="nav">
      <a href="/">Home</a>
      <a href="/date-difference/">Date Difference</a>
    </div>
    <h1>BMI Calculator</h1>
    <p style="margin:0 0 8px;color:#e8e8ff;font-size:13px">Enter your weight and height</p>

    <label>Weight</label>
    <div class="row">
      <input id="weight" type="number" min="0" placeholder="e.g. 70" />
      <select id="weight-unit" style="width:110px">
        <option value="kg">kg</option>
        <option value="lb">lb</option>
      </select>
    </div>

    <label>Height</label>
    <div class="row">
      <input id="height" type="number" min="0" placeholder="e.g. 175" />
      <select id="height-unit" style="width:110px">
        <option value="cm">cm</option>
        <option value="in">in</option>
      </select>
    </div>

    <div class="btns">
      <button class="reset" onclick="resetBMI()">Reset</button>
      <button class="calc" onclick="calculateBMI()">Calculate</button>
    </div>

    <div id="bmi-result" class="result" aria-live="polite"></div>
  </div>

<script>
function calculateBMI(){
  const w = parseFloat(document.getElementById('weight').value);
  const h = parseFloat(document.getElementById('height').value);
  const wUnit = document.getElementById('weight-unit').value;
  const hUnit = document.getElementById('height-unit').value;
  const out = document.getElementById('bmi-result');

  if (!w || !h){ out.innerHTML = '⚠️ Please enter weight and height.'; return; }

  // convert to metric
  let weightKg = wUnit === 'kg' ? w : w * 0.45359237;
  let heightM = hUnit === 'cm' ? h/100 : h * 0.0254;

  if (heightM <= 0){ out.innerHTML = '🚫 Invalid height'; return; }

  const bmi = weightKg / (heightM * heightM);
  const bmiRounded = Math.round(bmi * 10)/10;

  let category = '';
  if (bmi < 18.5) category = 'Underweight';
  else if (bmi < 25) category = 'Normal weight';
  else if (bmi < 30) category = 'Overweight';
  else category = 'Obese';

  out.innerHTML = `<b>BMI:</b> ${bmiRounded} <br><b>Category:</b> ${category} <br><small>Weight(${wUnit})→kg:${Math.round(weightKg*10)/10}, Height(${hUnit})→m:${Math.round(heightM*100)/100}</small>`;
}

function resetBMI(){
  document.getElementById('weight').value = '';
  document.getElementById('height').value = '';
  document.getElementById('bmi-result').innerHTML = '';
}
</script>
</body>
</html>
