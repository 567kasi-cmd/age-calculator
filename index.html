<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-site-verification" content="4MeiinHQRVw7UUJCJ6C8Z7pdbnxFc-A5Jb1LtLdmIu8" />
  <title>Advanced Age Calculator</title>
  <meta name="description" content="The Age Finder — instantly calculate your exact age in years, months, days, hours, and minutes. Simple, fast, and accurate!" />
  <meta name="keywords" content="age calculator, the age finder, calculate age, birthday tool, online age calculator" />
  <meta name="author" content="Kasi" />
  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="The Age Finder — Accurate Age Calculator" />
  <meta property="og:description" content="Find your exact age instantly with The Age Finder. Free, simple, and precise age calculator tool." />
  <meta property="og:url" content="https://theagefinder.netlify.app/" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/agecalc-preview.png" />

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      width: 320px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 26px;
      letter-spacing: 1px;
    }

    input[type="date"] {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 15px;
      outline: none;
    }

    button {
      margin-top: 20px;
      background: #fff;
      color: #764ba2;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
    }

    button:hover {
      background: #764ba2;
      color: #fff;
    }

    .result {
      margin-top: 25px;
      font-size: 18px;
      line-height: 1.6;
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Age Calculator</h1>
    <p>Select your date of birth:</p>
    <input type="date" id="dob" />
    <button onclick="calculateAge()">Calculate</button>

    <div class="result" id="result"></div>
  </div>

  <footer>© 2025 Age Calculator | Made with ❤️</footer>

 <script>
  function calculateAge() {
    const dobInput = document.getElementById('dob').value;
    const result = document.getElementById('result');
    const now = new Date();

    if (!dobInput) {
      result.innerHTML = "⚠️ Please select your birth date.";
      return;
    }

    const dob = new Date(dobInput);

    if (dob > now) {
      result.innerHTML = "🚫 Birth date cannot be in the future.";
      return;
    }

    // 🗓️ If user entered today's date
    if (
      dob.getDate() === now.getDate() &&
      dob.getMonth() === now.getMonth() &&
      dob.getFullYear() === now.getFullYear()
    ) {
      result.innerHTML = "🗓️ You entered today's date!";
      return;
    }

    // 🎂 Check if today is their birthday
    if (dob.getDate() === now.getDate() && dob.getMonth() === now.getMonth()) {
      result.innerHTML = "🎉 Happy Birthday! 🥳";
    }

    const diffMs = now - dob;
    const diffMins = Math.floor(diffMs / (1000 * 60));
    const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
    const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

    let years = now.getFullYear() - dob.getFullYear();
    let months = now.getMonth() - dob.getMonth();
    let days = now.getDate() - dob.getDate();

    if (days < 0) {
      months--;
      const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
      days += prevMonth.getDate();
    }

    if (months < 0) {
      years--;
      months += 12;
    }

    // 🎈 Next Birthday Countdown
    let nextBirthday = new Date(now.getFullYear(), dob.getMonth(), dob.getDate());
    if (nextBirthday < now) {
      nextBirthday.setFullYear(now.getFullYear() + 1);
    }
    const daysUntilNextBirthday = Math.ceil((nextBirthday - now) / (1000 * 60 * 60 * 24));

    let birthdayMsg = "";
    if (dob.getDate() === now.getDate() && dob.getMonth() === now.getMonth()) {
      birthdayMsg = "🎉 Happy Birthday! 🥳";
    } else {
      birthdayMsg = `⏳ <b>Days until your next birthday:</b> ${daysUntilNextBirthday} days`;
    }

    result.innerHTML = `
      ${birthdayMsg}<br><br>
      🎂 You are <b>${years}</b> years, <b>${months}</b> months, and <b>${days}</b> days old.<br><br>
      ⏱️ That's approximately:<br>
      <b>${diffDays.toLocaleString()}</b> days<br>
      <b>${diffHours.toLocaleString()}</b> hours<br>
      <b>${diffMins.toLocaleString()}</b> minutes
    `;
  }
</script>
</body>
</html>
