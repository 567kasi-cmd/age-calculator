<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎓 Education Loan EMI Calculator | The Age Finder</title>
  <meta name="description" content="Easily calculate your Education loan EMI with our free online tool. Enter loan amount, interest rate, and tenure to get instant results.">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }

    header h1 {
      margin-bottom: 20px;
    }

    form {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
    }

    label {
      display: block;
      margin: 12px 0;
      text-align: left;
    }

    input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      outline: none;
      font-size: 16px;
    }

    button {
      margin-top: 20px;
      background: #fff;
      color: #764ba2;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #764ba2;
      color: #fff;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: 600;
    }

    footer {
      margin-top: 20px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
    }

    footer a {
      color: #ffd700;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎓 Education Loan EMI Calculator</h1>
  </header>

  <main>
    <form id="emiForm">
      <label>Loan Amount (₹): <input type="number" id="amount" required></label>
      <label>Interest Rate (% per annum): <input type="number" id="rate" step="0.01" required></label>
      <label>Loan Tenure (months): <input type="number" id="months" required></label>
      <button type="submit">Calculate EMI</button>
    </form>

    <h2 id="result"></h2>
  </main>

  <footer>
    <a href="/emi-calculator/">← Back to EMI Calculators</a>
  </footer>

  <script src="/emi-calculator/emi.js"></script>
</body>
</html>
