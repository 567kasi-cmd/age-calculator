<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Loan EMI Calculator | The Age Finder</title>
  <meta name="description" content="Easily calculate your home loan EMI with our free online tool. Enter loan amount, interest rate, and tenure to get instant results.">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>🏠 Home Loan EMI Calculator</h1>
  </header>

  <main>
    <form id="emiForm">
      <label>Loan Amount (₹): <input type="number" id="amount" required></label><br>
      <label>Interest Rate (% per annum): <input type="number" id="rate" step="0.01" required></label><br>
      <label>Loan Tenure (months): <input type="number" id="months" required></label><br>
      <button type="submit">Calculate EMI</button>
    </form>

    <h2 id="result"></h2>
  </main>

  <footer>
    <a href="/emi-calculator/">← Back to EMI Calculators</a>
  </footer>

  <script src="/emi-calculator/emi.js"></script>
</body>
</html>
