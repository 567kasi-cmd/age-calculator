<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💳 Credit Card EMI Calculator | The Age Finder</title>
  <meta name="description" content="Easily calculate your credit card EMI, total interest, and total payment. Simple, fast, and accurate EMI calculator.">
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.8s ease-in-out;
    }

    header {
      text-align: center;
      padding: 50px 20px 20px;
    }

    header h1 {
      font-size: 2rem;
      color: #ffd700;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
    }

    header p {
      font-size: 1rem;
      opacity: 0.9;
      color: #fff;
    }

    .calculator-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.2);
      margin-bottom: 40px;
    }

    label {
      display: block;
      margin: 15px 0 5px;
      font-weight: 600;
      color: #fff;
    }

    input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    input::placeholder {
      color: rgba(255,255,255,0.7);
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #ffd700;
      color: #000;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #fff;
      color: #000;
      transform: scale(1.05);
    }

    .result {
      margin-top: 25px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      line-height: 1.6;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    footer {
      text-align: center;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      margin-top: auto;
      padding: 20px;
    }

    footer a {
      color: #ffd700;
      text-decoration: none;
      transition: 0.3s;
    }

    footer a:hover {
      text-decoration: underline;
      color: #fff;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <header>
    <h1>💳 Credit Card EMI Calculator</h1>
    <p>Calculate your monthly credit card EMI with total interest and payment breakdown.</p>
  </header>

  <main class="calculator-card">
    <label>Purchase Amount (₹)</label>
    <input type="number" id="amount" placeholder="Enter purchase amount">

    <label>Interest Rate (% per annum)</label>
    <input type="number" id="rate" placeholder="e.g. 24">

    <label>Tenure (months)</label>
    <input type="number" id="months" placeholder="e.g. 12">

    <button onclick="calculateEMI()">Calculate EMI</button>

    <div class="result" id="result"></div>
  </main>

  <footer>
    <a href="/emi/">← Back to EMI Calculators</a>
  </footer>

  <script>
    function calculateEMI() {
      const P = parseFloat(document.getElementById("amount").value);
      const R = parseFloat(document.getElementById("rate").value) / 12 / 100;
      const N = parseFloat(document.getElementById("months").value);
      const resultDiv = document.getElementById("result");

      if (isNaN(P) || isNaN(R) || isNaN(N) || N <= 0) {
        resultDiv.innerHTML = "<p>Please enter valid values for all fields.</p>";
        return;
      }

      const emi = (P * R * Math.pow(1 + R, N)) / (Math.pow(1 + R, N) - 1);
      const totalPayment = emi * N;
      const totalInterest = totalPayment - P;

      resultDiv.innerHTML = `
        <h3>📊 Results</h3>
        <p><strong>Monthly EMI:</strong> ₹${emi.toFixed(2)}</p>
        <p><strong>Total Interest:</strong> ₹${totalInterest.toFixed(2)}</p>
        <p><strong>Total Payment:</strong> ₹${totalPayment.toFixed(2)}</p>
      `;
    }
  </script>
</body>
</html>
