<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credit Card EMI Calculator</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
      background-color: #f9f9f9;
    }
    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background-color: #0056b3;
    }
    .result {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <h1>💳 Credit Card EMI Calculator</h1>

  <label>Purchase Amount (₹)</label>
  <input type="number" id="amount" placeholder="Enter amount" />

  <label>Interest Rate (% per annum)</label>
  <input type="number" id="rate" placeholder="e.g. 24" />

  <label>Tenure (months)</label>
  <input type="number" id="months" placeholder="e.g. 12" />

  <button onclick="calculateEMI()">Calculate EMI</button>

  <div class="result" id="result"></div>

  <script>
    function calculateEMI() {
      const P = parseFloat(document.getElementById("amount").value);
      const R = parseFloat(document.getElementById("rate").value) / 12 / 100;
      const N = parseFloat(document.getElementById("months").value);

      if (isNaN(P) || isNaN(R) || isNaN(N) || N <= 0) {
        document.getElementById("result").innerHTML = "<p>Please enter valid values.</p>";
        return;
      }

      const emi = (P * R * Math.pow(1 + R, N)) / (Math.pow(1 + R, N) - 1);
      const totalPayment = emi * N;
      const totalInterest = totalPayment - P;

      document.getElementById("result").innerHTML = `
        <h3>Result:</h3>
        <p><strong>Monthly EMI:</strong> ₹${emi.toFixed(2)}</p>
        <p><strong>Total Interest:</strong> ₹${totalInterest.toFixed(2)}</p>
        <p><strong>Total Payment:</strong> ₹${totalPayment.toFixed(2)}</p>
      `;
    }
  </script>
</body>
</html>
